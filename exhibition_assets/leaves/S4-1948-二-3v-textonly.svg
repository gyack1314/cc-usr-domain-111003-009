<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="#ffffff"/><text x="64" y="100" font-size="28" fill="#243747">海湾港区建设史 · 公开文字版（剥离受限图版）</text><text x="64" y="140" font-size="24" fill="#243747">1948版 · 第二章 · 叶面 3v · 源自扫描 S4</text><text x="64" y="180" font-size="24" fill="#243747">正文文字使用许可：RIGHT-T，署名「海湾档案馆」，公开展陈有效</text><text x="64" y="220" font-size="24" fill="#243747">期至 2027-12-31</text><text x="64" y="260" font-size="24" fill="#243747">本件仅为文字信息副本，不复制原扫描中的任何照片画面；以下图位在公开</text><text x="64" y="300" font-size="24" fill="#243747">素材中留白。</text><rect x="64" y="360" width="772" height="360" fill="#f8fafc" stroke="#c2410c" stroke-width="4" stroke-dasharray="16 10"/><text x="450" y="530" font-size="26" fill="#9a3412" text-anchor="middle">图位留白（公开许可不足，禁止放置原图）</text><text x="96" y="560" font-size="18" fill="#7c2d12">F2：许可用途不含公开展陈，内部研究权限不能转为展板公开权限</text><text x="64" y="1080" font-size="18" fill="#475569">文字占位/文字版为合法替代，不构成授权补正，亦不修补缺失历史内容。</text></svg>