<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="#fff7ed" stroke="#c2410c" stroke-width="6" stroke-dasharray="18 12"/><text x="64" y="120" font-size="26" fill="#7c2d12">留白占位 · 第三章 · 1948版 · 叶面 4v</text><text x="64" y="300" font-size="20" fill="#475569">该叶在 1948 完整本扫描中缺失（领域工具 coverage 判定</text><text x="64" y="338" font-size="20" fill="#475569"> missing）。</text><text x="64" y="376" font-size="20" fill="#475569">存在 1952 异版 S10（S10@c5003b8809007a4</text><text x="64" y="414" font-size="20" fill="#475569">d7eeb4f8ac5ba4d26a270ac6fb6052ceb4</text><text x="64" y="452" font-size="20" fill="#475569">a41a5cd03e0faa3），但馆藏等价记录 EQ（EQ@2a4</text><text x="64" y="490" font-size="20" fill="#475569">0a392c20a19156431fc91665af0d6c7f8b</text><text x="64" y="528" font-size="20" fill="#475569">1cdfe7fb0c17c4b25b55c1367c6）证明 equ</text><text x="64" y="566" font-size="20" fill="#475569">ivalent=false：1952删去船坞段，不得替代；该异版仅登</text><text x="64" y="604" font-size="20" fill="#475569">记于内部研究目录</text><text x="64" y="642" font-size="20" fill="#475569">依业务规程不得伪造或以无等价证明的异版补齐，展板此处必须留白。</text><text x="64" y="1060" font-size="18" fill="#9a3412">本文件为文字占位，非历史文献扫描件，不承载任何原图内容。</text></svg>