<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1200" viewBox="0 0 900 1200"><rect width="900" height="1200" fill="#fff7ed" stroke="#c2410c" stroke-width="6" stroke-dasharray="18 12"/><text x="64" y="120" font-size="26" fill="#7c2d12">留白占位 · 第二章 · 1948版 · 叶面 3v（扫描 S4）</text><text x="64" y="300" font-size="20" fill="#475569">本叶正文文字已获准公开展陈，但所含照片未取得覆盖完整展期的公开许可：</text><text x="64" y="338" font-size="20" fill="#475569">F2：许可用途不含公开展陈，内部研究权限不能转为展板公开权限</text><text x="64" y="376" font-size="20" fill="#475569">文字许可不自动涵盖照片；原图仅存内部研究副本，展板此图位必须留白或换</text><text x="64" y="414" font-size="20" fill="#475569">用获准素材。</text><text x="64" y="1060" font-size="18" fill="#9a3412">本文件为文字占位，非历史文献扫描件，不承载任何原图内容。</text></svg>